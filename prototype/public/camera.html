<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#1155B8" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>Fincore — Smart Spend Scanner</title>
  <script src="https://unpkg.com/@zxing/library@0.20.0/umd/index.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --blue-dark: #1155B8;
      --blue-mid:  #1565C0;
      --blue-light:#1E88E5;
      --glass-bg:  rgba(255,255,255,0.10);
      --glass-border: rgba(255,255,255,0.22);
      --text:      #ffffff;
      --text-dim:  rgba(255,255,255,0.70);
      --green:     #4CAF50;
      --amber:     #FF9800;
      --red:       #F44336;
      --radius:    16px;
    }

    html, body {
      height: 100%;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(145deg, var(--blue-dark) 0%, var(--blue-light) 100%);
      color: var(--text);
      overflow: hidden;
    }

    /* ── SCREEN MANAGEMENT ── */
    .screen { display: none; height: 100vh; overflow-y: auto; }
    .screen.active { display: flex; flex-direction: column; }

    /* ── GLASSMORPHISM CARD ── */
    .glass {
      background: var(--glass-bg);
      border: 1px solid var(--glass-border);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-radius: var(--radius);
    }

    /* ══════════════════════════════════════
       SCREEN 1 — CAMERA
    ══════════════════════════════════════ */
    #screen-camera {
      position: relative;
      align-items: center;
      justify-content: space-between;
      padding: 0;
    }

    /* Header */
    .cam-header {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 52px 20px 14px;
      background: linear-gradient(to bottom, rgba(0,0,0,0.45), transparent);
      position: absolute;
      top: 0; left: 0; z-index: 10;
    }
    .cam-header .logo {
      font-size: 22px;
      font-weight: 800;
      letter-spacing: -0.5px;
    }
    .cam-header .logo span { color: #82b4ff; }

    /* Mode toggle */
    .mode-toggle {
      display: flex;
      background: rgba(0,0,0,0.35);
      border: 1px solid var(--glass-border);
      border-radius: 50px;
      padding: 3px;
      gap: 2px;
    }
    .mode-btn {
      padding: 7px 16px;
      border-radius: 50px;
      border: none;
      cursor: pointer;
      font-size: 13px;
      font-weight: 600;
      color: var(--text-dim);
      background: transparent;
      transition: all 0.25s;
    }
    .mode-btn.active {
      background: var(--blue-light);
      color: #fff;
    }

    /* Video / viewfinder */
    #video {
      width: 100%;
      height: 100vh;
      object-fit: cover;
      position: absolute;
      top: 0; left: 0;
      z-index: 0;
    }
    .viewfinder-overlay {
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      width: min(72vw, 300px);
      height: min(72vw, 300px);
      z-index: 5;
      pointer-events: none;
    }
    /* Corner brackets */
    .corner {
      position: absolute;
      width: 28px; height: 28px;
      border-color: #fff;
      border-style: solid;
      border-width: 0;
      opacity: 0.9;
    }
    .corner.tl { top:0; left:0;  border-top-width:3px; border-left-width:3px;  border-top-left-radius:4px; }
    .corner.tr { top:0; right:0; border-top-width:3px; border-right-width:3px; border-top-right-radius:4px; }
    .corner.bl { bottom:0; left:0;  border-bottom-width:3px; border-left-width:3px;  border-bottom-left-radius:4px; }
    .corner.br { bottom:0; right:0; border-bottom-width:3px; border-right-width:3px; border-bottom-right-radius:4px; }

    /* Scan line */
    .scan-line {
      position: absolute;
      top: 0; left: 4px; right: 4px;
      height: 2px;
      background: linear-gradient(90deg, transparent, #82b4ff, transparent);
      border-radius: 2px;
      animation: scan 2s ease-in-out infinite;
    }
    @keyframes scan {
      0%   { top: 4px;  opacity: 1; }
      90%  { top: calc(100% - 6px); opacity: 1; }
      100% { top: calc(100% - 6px); opacity: 0; }
    }

    /* Bottom controls */
    .cam-footer {
      position: absolute;
      bottom: 0; left: 0;
      width: 100%;
      padding: 24px 20px 48px;
      background: linear-gradient(to top, rgba(0,0,0,0.55), transparent);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
      z-index: 10;
    }
    .cam-hint {
      font-size: 13px;
      color: var(--text-dim);
      text-align: center;
    }
    .shutter-wrap {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 40px;
    }
    .shutter-btn {
      width: 72px; height: 72px;
      border-radius: 50%;
      border: 4px solid rgba(255,255,255,0.8);
      background: rgba(255,255,255,0.2);
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: transform 0.15s, background 0.15s;
      -webkit-tap-highlight-color: transparent;
    }
    .shutter-btn:active { transform: scale(0.93); background: rgba(255,255,255,0.35); }
    .shutter-inner {
      width: 52px; height: 52px;
      border-radius: 50%;
      background: #fff;
    }
    .icon-btn {
      width: 48px; height: 48px;
      border-radius: 50%;
      border: 2px solid var(--glass-border);
      background: var(--glass-bg);
      color: #fff;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      font-size: 20px;
      -webkit-tap-highlight-color: transparent;
    }

    /* Hidden canvas for capture */
    #canvas { display: none; }

    /* ══════════════════════════════════════
       SCREEN 2 — LOADING
    ══════════════════════════════════════ */
    #screen-loading {
      align-items: center;
      justify-content: center;
      gap: 24px;
      text-align: center;
      padding: 32px;
    }
    .loading-ring {
      width: 72px; height: 72px;
      border: 4px solid rgba(255,255,255,0.2);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.9s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .loading-title { font-size: 22px; font-weight: 700; }
    .loading-sub   { font-size: 14px; color: var(--text-dim); max-width: 260px; }

    /* ══════════════════════════════════════
       SCREEN 3 — RESULTS
    ══════════════════════════════════════ */
    #screen-results {
      padding: 52px 18px 32px;
      gap: 14px;
    }

    /* Top bar */
    .results-topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 2px;
    }
    .back-btn {
      background: var(--glass-bg);
      border: 1px solid var(--glass-border);
      color: #fff;
      border-radius: 50px;
      padding: 8px 16px;
      font-size: 13px;
      cursor: pointer;
    }
    .results-logo { font-size: 18px; font-weight: 800; }
    .results-logo span { color: #82b4ff; }

    /* Score donut */
    .score-card {
      padding: 24px;
      display: flex;
      align-items: center;
      gap: 20px;
    }
    .donut-wrap { position: relative; width: 96px; height: 96px; flex-shrink: 0; }
    .donut-wrap svg { width: 96px; height: 96px; transform: rotate(-90deg); }
    .donut-bg   { fill: none; stroke: rgba(255,255,255,0.15); stroke-width: 8; }
    .donut-fg   { fill: none; stroke-width: 8; stroke-linecap: round;
                  transition: stroke-dashoffset 1s ease, stroke 0.5s; }
    .donut-center {
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      text-align: center;
      line-height: 1.1;
    }
    .donut-score { font-size: 26px; font-weight: 800; }
    .donut-grade { font-size: 12px; color: var(--text-dim); }

    .score-meta { flex: 1; }
    .score-product { font-size: 15px; font-weight: 700; margin-bottom: 4px; }
    .score-verdict { font-size: 13px; color: var(--text-dim); line-height: 1.4; }
    .score-color-pill {
      display: inline-block;
      margin-top: 8px;
      padding: 3px 12px;
      border-radius: 50px;
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .pill-green { background: rgba(76,175,80,0.25); color: #81c784; border: 1px solid rgba(76,175,80,0.4); }
    .pill-amber { background: rgba(255,152,0,0.25); color: #ffb74d; border: 1px solid rgba(255,152,0,0.4); }
    .pill-red   { background: rgba(244,67,54,0.25);  color: #ef9a9a; border: 1px solid rgba(244,67,54,0.4); }

    /* Breakdown bars */
    .section-title {
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--text-dim);
      margin-bottom: 10px;
    }
    .breakdown-card { padding: 16px 18px; }
    .bar-row { margin-bottom: 12px; }
    .bar-row:last-child { margin-bottom: 0; }
    .bar-label {
      display: flex;
      justify-content: space-between;
      font-size: 13px;
      margin-bottom: 5px;
    }
    .bar-label span:last-child { color: var(--text-dim); }
    .bar-track {
      height: 6px;
      background: rgba(255,255,255,0.12);
      border-radius: 6px;
      overflow: hidden;
    }
    .bar-fill {
      height: 100%;
      border-radius: 6px;
      transition: width 1s ease;
    }

    /* Recs list */
    .recs-card { padding: 16px 18px; }
    .rec-item {
      display: flex;
      gap: 10px;
      margin-bottom: 10px;
      font-size: 13px;
      line-height: 1.45;
    }
    .rec-item:last-child { margin-bottom: 0; }
    .rec-icon { font-size: 15px; flex-shrink: 0; margin-top: 1px; }

    /* Insight */
    .insight-card { padding: 16px 18px; }
    .insight-text { font-size: 13px; color: var(--text-dim); line-height: 1.55; }

    /* Alternatives */
    .alts-card { padding: 16px 18px; }
    .alt-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 9px 12px;
      background: rgba(255,255,255,0.07);
      border-radius: 10px;
      margin-bottom: 8px;
      font-size: 13px;
    }
    .alt-item:last-child { margin-bottom: 0; }
    .alt-icon { font-size: 16px; }

    /* CTA */
    .cta-row { display: flex; gap: 10px; margin-top: 4px; }
    .cta-btn {
      flex: 1;
      padding: 14px;
      border-radius: 12px;
      border: none;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      transition: opacity 0.2s;
    }
    .cta-btn:active { opacity: 0.8; }
    .cta-primary   { background: #fff; color: var(--blue-dark); }
    .cta-secondary { background: var(--glass-bg); border: 1px solid var(--glass-border); color: #fff; }

    /* ══════════════════════════════════════
       SCREEN 4 — PRICES
    ══════════════════════════════════════ */
    #screen-prices {
      padding: 52px 18px 32px;
      gap: 14px;
    }
    .prices-topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 2px;
    }
    .cheapest-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 10px 18px;
      border-radius: 50px;
      background: rgba(76,175,80,0.20);
      border: 1px solid rgba(76,175,80,0.40);
      font-size: 15px;
      font-weight: 700;
    }
    .cheapest-pill .store-name { color: #81c784; }
    .savings-banner {
      padding: 14px 16px;
      border-radius: 12px;
      background: rgba(255,152,0,0.18);
      border: 1px solid rgba(255,152,0,0.35);
      font-size: 13px;
      color: #ffcc80;
      text-align: center;
    }
    .store-list-card { padding: 6px 0; }
    .store-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 18px;
      border-bottom: 1px solid rgba(255,255,255,0.08);
      transition: background 0.15s;
    }
    .store-row:last-child { border-bottom: none; }
    .store-row.cheapest-row { background: rgba(76,175,80,0.10); }
    .store-left { display: flex; align-items: center; gap: 10px; }
    .store-icon {
      width: 36px; height: 36px;
      border-radius: 8px;
      background: rgba(255,255,255,0.12);
      display: flex; align-items: center; justify-content: center;
      font-size: 18px;
    }
    .store-name-text { font-size: 14px; font-weight: 600; }
    .store-unit      { font-size: 11px; color: var(--text-dim); margin-top: 2px; }
    .store-right { text-align: right; }
    .store-price { font-size: 18px; font-weight: 800; }
    .store-badge {
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      color: #81c784;
      background: rgba(76,175,80,0.2);
      border-radius: 4px;
      padding: 2px 6px;
      margin-top: 2px;
      display: inline-block;
    }

    /* ── MISC ── */
    .error-card {
      padding: 20px;
      background: rgba(244,67,54,0.15);
      border: 1px solid rgba(244,67,54,0.35);
      border-radius: 14px;
      text-align: center;
      font-size: 14px;
      line-height: 1.5;
    }
    .error-card .error-icon { font-size: 32px; margin-bottom: 10px; }
  </style>
</head>
<body>

<!-- ══════════════════════════════════════
     SCREEN 1 — CAMERA
══════════════════════════════════════ -->
<div id="screen-camera" class="screen active">
  <video id="video" autoplay playsinline muted></video>
  <canvas id="canvas"></canvas>

  <header class="cam-header">
    <div class="logo">Fin<span>core</span></div>
    <div class="mode-toggle">
      <button class="mode-btn active" id="btn-analyse" onclick="setMode('analyse')">Analyse</button>
      <button class="mode-btn"        id="btn-price"   onclick="setMode('price')">Price Check</button>
    </div>
  </header>

  <div class="viewfinder-overlay">
    <div class="corner tl"></div>
    <div class="corner tr"></div>
    <div class="corner bl"></div>
    <div class="corner br"></div>
    <div class="scan-line"></div>
  </div>

  <footer class="cam-footer">
    <p class="cam-hint" id="cam-hint">Point at a product or price tag and tap the shutter</p>
    <div class="shutter-wrap">
      <button class="icon-btn" onclick="flipCamera()" title="Flip camera">🔄</button>
      <button class="shutter-btn" onclick="capturePhoto()" id="shutter">
        <div class="shutter-inner"></div>
      </button>
      <button class="icon-btn" onclick="openGallery()" title="Gallery">🖼️</button>
    </div>
  </footer>
  <input type="file" id="file-input" accept="image/*" style="display:none" onchange="handleFileSelect(event)" />
</div>


<!-- ══════════════════════════════════════
     SCREEN 2 — LOADING
══════════════════════════════════════ -->
<div id="screen-loading" class="screen">
  <div class="loading-ring"></div>
  <div class="loading-title" id="loading-title">Analysing…</div>
  <div class="loading-sub" id="loading-sub">Fincore AI is reviewing your image</div>
</div>


<!-- ══════════════════════════════════════
     SCREEN 3 — RESULTS
══════════════════════════════════════ -->
<div id="screen-results" class="screen">
  <div class="results-topbar">
    <button class="back-btn" onclick="goCamera()">← Back</button>
    <div class="results-logo">Fin<span>core</span></div>
    <div style="width:72px"></div>
  </div>

  <!-- Score donut -->
  <div class="glass score-card">
    <div class="donut-wrap">
      <svg viewBox="0 0 96 96">
        <circle class="donut-bg" cx="48" cy="48" r="40" />
        <circle class="donut-fg" id="donut-fg" cx="48" cy="48" r="40"
          stroke-dasharray="251.2" stroke-dashoffset="251.2" />
      </svg>
      <div class="donut-center">
        <div class="donut-score" id="res-score">–</div>
        <div class="donut-grade" id="res-grade">–</div>
      </div>
    </div>
    <div class="score-meta">
      <div class="score-product" id="res-product">–</div>
      <div class="score-verdict" id="res-verdict">–</div>
      <span class="score-color-pill" id="res-pill">–</span>
    </div>
  </div>

  <!-- Breakdown bars -->
  <div class="glass breakdown-card">
    <div class="section-title">Score Breakdown</div>
    <div class="bar-row">
      <div class="bar-label"><span>Value for Money</span><span id="bar-vfm-val">–</span></div>
      <div class="bar-track"><div class="bar-fill" id="bar-vfm" style="width:0%"></div></div>
    </div>
    <div class="bar-row">
      <div class="bar-label"><span>Necessity</span><span id="bar-nec-val">–</span></div>
      <div class="bar-track"><div class="bar-fill" id="bar-nec" style="width:0%"></div></div>
    </div>
    <div class="bar-row">
      <div class="bar-label"><span>Budget Impact</span><span id="bar-bud-val">–</span></div>
      <div class="bar-track"><div class="bar-fill" id="bar-bud" style="width:0%"></div></div>
    </div>
  </div>

  <!-- Recommendations -->
  <div class="glass recs-card">
    <div class="section-title">Recommendations</div>
    <div id="recs-list"></div>
  </div>

  <!-- Financial insight -->
  <div class="glass insight-card">
    <div class="section-title">Financial Insight</div>
    <div class="insight-text" id="res-insight">–</div>
  </div>

  <!-- Alternatives -->
  <div class="glass alts-card" id="alts-card">
    <div class="section-title">Cheaper Alternatives</div>
    <div id="alts-list"></div>
  </div>

  <!-- CTAs -->
  <div class="cta-row">
    <button class="cta-btn cta-secondary" onclick="goCamera()">Scan Again</button>
    <button class="cta-btn cta-primary"   onclick="checkPricesFromResult()">Check Prices</button>
  </div>
</div>


<!-- ══════════════════════════════════════
     SCREEN 4 — PRICES
══════════════════════════════════════ -->
<div id="screen-prices" class="screen">
  <div class="prices-topbar">
    <button class="back-btn" onclick="goCamera()">← Back</button>
    <div class="results-logo">Fin<span>core</span></div>
    <div style="width:72px"></div>
  </div>

  <div id="prices-content">
    <!-- populated by JS -->
  </div>

  <button class="cta-btn cta-secondary" style="margin-top:8px" onclick="goCamera()">Scan Another</button>
</div>


<script>
/* ─────────────────────────────────────────
   CONFIG
───────────────────────────────────────── */
const API_BASE = window.FINCORE_API_BASE || 'http://localhost:8000';

/* ─────────────────────────────────────────
   STATE
───────────────────────────────────────── */
let currentMode      = 'analyse';   // 'analyse' | 'price'
let facingMode       = 'environment';
let stream           = null;
let barcodeReader    = null;
let barcodeScanActive= false;
let lastBarcode      = null;
let lastAnalysisResult = null;

/* ─────────────────────────────────────────
   SCREEN MANAGEMENT
───────────────────────────────────────── */
function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}
function goCamera() {
  showScreen('screen-camera');
  if (!stream) startCamera();
  if (currentMode === 'price') startBarcodeScanning();
}

/* ─────────────────────────────────────────
   MODE TOGGLE
───────────────────────────────────────── */
function setMode(mode) {
  currentMode = mode;
  document.getElementById('btn-analyse').classList.toggle('active', mode === 'analyse');
  document.getElementById('btn-price').classList.toggle('active', mode === 'price');
  const hint = document.getElementById('cam-hint');
  const shutter = document.getElementById('shutter');

  if (mode === 'price') {
    hint.textContent = 'Point at a barcode — it will scan automatically';
    shutter.style.opacity = '0.4';
    shutter.style.pointerEvents = 'none';
    startBarcodeScanning();
  } else {
    hint.textContent = 'Point at a product or price tag and tap the shutter';
    shutter.style.opacity = '1';
    shutter.style.pointerEvents = '';
    stopBarcodeScanning();
  }
}

/* ─────────────────────────────────────────
   CAMERA
───────────────────────────────────────── */
async function startCamera() {
  try {
    if (stream) { stream.getTracks().forEach(t => t.stop()); }
    stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode, width: { ideal: 1920 }, height: { ideal: 1080 } },
      audio: false,
    });
    document.getElementById('video').srcObject = stream;
  } catch (err) {
    console.error('Camera error:', err);
    alert('Could not access camera: ' + err.message);
  }
}

async function flipCamera() {
  facingMode = facingMode === 'environment' ? 'user' : 'environment';
  stopBarcodeScanning();
  await startCamera();
  if (currentMode === 'price') startBarcodeScanning();
}

function openGallery() {
  document.getElementById('file-input').click();
}

function handleFileSelect(event) {
  const file = event.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = e => {
    const dataUrl = e.target.result;
    const base64  = dataUrl.split(',')[1];
    const mimeType = file.type || 'image/jpeg';
    if (currentMode === 'analyse') {
      runAnalysis(base64, mimeType);
    }
  };
  reader.readAsDataURL(file);
  event.target.value = '';
}

/* ─────────────────────────────────────────
   CAPTURE & ANALYSE
───────────────────────────────────────── */
function capturePhoto() {
  const video  = document.getElementById('video');
  const canvas = document.getElementById('canvas');
  canvas.width  = video.videoWidth  || 640;
  canvas.height = video.videoHeight || 480;
  canvas.getContext('2d').drawImage(video, 0, 0);
  const dataUrl  = canvas.toDataURL('image/jpeg', 0.85);
  const base64   = dataUrl.split(',')[1];
  runAnalysis(base64, 'image/jpeg');
}

async function runAnalysis(base64, mediaType) {
  showScreen('screen-loading');
  document.getElementById('loading-title').textContent = 'Analysing…';
  document.getElementById('loading-sub').textContent   = 'Fincore AI is reviewing your image';

  try {
    const resp = await fetch(`${API_BASE}/analyze`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ image_base64: base64, media_type: mediaType }),
    });
    const data = await resp.json();

    if (!data.success || !data.analysis) {
      showError('screen-results', data.error || 'Analysis failed. Please try again.');
      return;
    }

    lastAnalysisResult = data.analysis;
    renderResults(data.analysis);
    showScreen('screen-results');
  } catch (err) {
    console.error('Analysis error:', err);
    showError('screen-results', 'Network error — make sure the backend is running.');
  }
}

/* ─────────────────────────────────────────
   RENDER RESULTS
───────────────────────────────────────── */
function renderResults(a) {
  // Score donut
  const score  = a.overall_score;
  const r      = 40;
  const circ   = 2 * Math.PI * r;
  const offset = circ - (score / 100) * circ;
  const color  = colorHex(a.color);
  const fg     = document.getElementById('donut-fg');
  fg.style.stroke = color;
  // Trigger animation after paint
  requestAnimationFrame(() => {
    requestAnimationFrame(() => { fg.style.strokeDashoffset = offset; });
  });

  document.getElementById('res-score').textContent = score;
  document.getElementById('res-grade').textContent  = a.grade;
  document.getElementById('res-product').textContent = a.product_identified;
  document.getElementById('res-verdict').textContent = a.verdict;

  const pill = document.getElementById('res-pill');
  pill.textContent  = a.color.toUpperCase();
  pill.className    = `score-color-pill pill-${a.color}`;

  // Bars
  const bd = a.breakdown;
  setBar('bar-vfm', 'bar-vfm-val', bd.value_for_money);
  setBar('bar-nec', 'bar-nec-val', bd.necessity);
  setBar('bar-bud', 'bar-bud-val', bd.budget_impact);

  // Recs
  const recsList = document.getElementById('recs-list');
  recsList.innerHTML = (a.recommendations || []).map(r =>
    `<div class="rec-item"><span class="rec-icon">💡</span><span>${esc(r)}</span></div>`
  ).join('');

  // Insight
  document.getElementById('res-insight').textContent = a.financial_insight || '';

  // Alternatives
  const altsCard = document.getElementById('alts-card');
  const altsList = document.getElementById('alts-list');
  if (a.alternatives && a.alternatives.length) {
    altsList.innerHTML = a.alternatives.map(alt =>
      `<div class="alt-item"><span class="alt-icon">🔄</span><span>${esc(alt)}</span></div>`
    ).join('');
    altsCard.style.display = '';
  } else {
    altsCard.style.display = 'none';
  }
}

function setBar(fillId, valId, value) {
  const fill = document.getElementById(fillId);
  const val  = document.getElementById(valId);
  val.textContent = value + '/100';
  // Color the bar based on value
  const c = value >= 70 ? '#4CAF50' : value >= 40 ? '#FF9800' : '#F44336';
  fill.style.background = c;
  requestAnimationFrame(() => {
    requestAnimationFrame(() => { fill.style.width = value + '%'; });
  });
}

function colorHex(color) {
  return color === 'green' ? '#4CAF50' : color === 'amber' ? '#FF9800' : '#F44336';
}

function esc(str) {
  return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

/* ─────────────────────────────────────────
   BARCODE SCANNING
───────────────────────────────────────── */
function startBarcodeScanning() {
  if (!window.ZXing) { console.warn('ZXing not loaded'); return; }
  stopBarcodeScanning();
  barcodeScanActive = true;
  const hints = new Map();
  const formats = [
    ZXing.BarcodeFormat.EAN_13,
    ZXing.BarcodeFormat.EAN_8,
    ZXing.BarcodeFormat.UPC_A,
    ZXing.BarcodeFormat.UPC_E,
    ZXing.BarcodeFormat.CODE_128,
  ];
  hints.set(ZXing.DecodeHintType.POSSIBLE_FORMATS, formats);
  barcodeReader = new ZXing.MultiFormatReader();
  barcodeReader.setHints(hints);
  scanLoop();
}

function stopBarcodeScanning() {
  barcodeScanActive = false;
  barcodeReader = null;
}

async function scanLoop() {
  const video  = document.getElementById('video');
  const canvas = document.getElementById('canvas');

  while (barcodeScanActive) {
    await new Promise(r => requestAnimationFrame(r));
    if (!video.readyState || video.readyState < 2) continue;

    try {
      canvas.width  = video.videoWidth  || 320;
      canvas.height = video.videoHeight || 240;
      canvas.getContext('2d').drawImage(video, 0, 0);
      const imageData = canvas.getContext('2d').getImageData(0, 0, canvas.width, canvas.height);
      const luminance = new ZXing.RGBLuminanceSource(imageData.data, canvas.width, canvas.height);
      const binary    = new ZXing.BinaryBitmap(new ZXing.HybridBinarizer(luminance));
      const result    = barcodeReader.decode(binary);

      if (result && result.getText()) {
        const barcode = result.getText();
        if (barcode !== lastBarcode) {
          lastBarcode = barcode;
          stopBarcodeScanning();
          runPriceCheck(barcode);
        }
      }
    } catch (e) {
      // NotFoundException is expected when no barcode visible — ignore
    }
  }
}

/* ─────────────────────────────────────────
   PRICE CHECK
───────────────────────────────────────── */
async function runPriceCheck(barcode) {
  showScreen('screen-loading');
  document.getElementById('loading-title').textContent = 'Checking Prices…';
  document.getElementById('loading-sub').textContent   = `Looking up barcode ${barcode}`;

  try {
    const resp = await fetch(`${API_BASE}/price-check`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ barcode }),
    });
    const data = await resp.json();
    renderPrices(data);
    showScreen('screen-prices');
  } catch (err) {
    console.error('Price check error:', err);
    renderPrices({ success: false, barcode, error: 'Network error — make sure the backend is running.' });
    showScreen('screen-prices');
  }
}

function checkPricesFromResult() {
  // Placeholder — user can scan barcode after viewing analysis
  goCamera();
  setMode('price');
}

/* ─────────────────────────────────────────
   RENDER PRICES
───────────────────────────────────────── */
function renderPrices(data) {
  const container = document.getElementById('prices-content');

  if (!data.success || !data.prices || data.prices.length === 0) {
    container.innerHTML = `
      <div class="error-card">
        <div class="error-icon">🔍</div>
        <div>${esc(data.error || 'No prices found for this barcode.')}</div>
        <div style="color:var(--text-dim);margin-top:6px;font-size:12px">Barcode: ${esc(data.barcode || '')}</div>
      </div>`;
    return;
  }

  const prices  = data.prices;
  const cheapest = prices[0];
  const priciest = prices[prices.length - 1];
  const savings  = priciest.price - cheapest.price;

  let html = `
    <div class="cheapest-pill">
      <span>Cheapest:</span>
      <span class="store-name">${esc(cheapest.store)}</span>
      <span style="font-size:20px;font-weight:900">£${cheapest.price.toFixed(2)}</span>
    </div>`;

  if (savings > 0.01) {
    html += `
      <div class="savings-banner">
        Save <strong>£${savings.toFixed(2)}</strong> by choosing ${esc(cheapest.store)} over ${esc(priciest.store)}
      </div>`;
  }

  const storeIcons = { tesco:'🛒', sainsbury:'🛍️', asda:'🏪', morrisons:'🌿', aldi:'💛', lidl:'🔵', waitrose:'🌹', coop:'🤝' };
  function storeIcon(name) {
    const lower = name.toLowerCase();
    for (const [k,v] of Object.entries(storeIcons)) if (lower.includes(k)) return v;
    return '🏬';
  }

  html += `<div class="glass store-list-card">`;
  prices.forEach((p, i) => {
    const isFirst = i === 0;
    html += `
      <div class="store-row ${isFirst ? 'cheapest-row' : ''}">
        <div class="store-left">
          <div class="store-icon">${storeIcon(p.store)}</div>
          <div>
            <div class="store-name-text">${esc(p.store)}</div>
            ${p.price_per_unit ? `<div class="store-unit">${esc(p.price_per_unit)}</div>` : ''}
          </div>
        </div>
        <div class="store-right">
          <div class="store-price">£${p.price.toFixed(2)}</div>
          ${isFirst ? '<div class="store-badge">Best price</div>' : ''}
        </div>
      </div>`;
  });
  html += `</div>`;

  container.innerHTML = html;
}

/* ─────────────────────────────────────────
   ERROR HELPER
───────────────────────────────────────── */
function showError(screenId, message) {
  if (screenId === 'screen-results') {
    // Replace score card with error
    document.getElementById('res-product').textContent = 'Error';
    document.getElementById('res-verdict').textContent = message;
    document.getElementById('res-score').textContent   = '–';
    document.getElementById('res-grade').textContent   = '–';
  }
  showScreen(screenId);
}

   INIT
───────────────────────────────────────── */
window.addEventListener('DOMContentLoaded', () => {
  startCamera();
});
